<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141412"/>
      <stop offset="100%" stop-color="#0a0a08"/>
    </linearGradient>
    <linearGradient id="gold1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe28a"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa820a"/>
    </linearGradient>
    <linearGradient id="lime1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8ff42"/>
      <stop offset="100%" stop-color="#9dd618"/>
    </linearGradient>
    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <pattern id="grid1" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.07"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg1)"/>
  <rect width="800" height="600" fill="url(#grid1)"/>

  <!-- Subtle circles for geometric construction -->
  <circle cx="400" cy="270" r="160" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <circle cx="400" cy="270" r="220" fill="none" stroke="#c8ff42" stroke-opacity="0.08" stroke-dasharray="4 6"/>
  <circle cx="400" cy="270" r="100" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

  <!-- Construction lines -->
  <line x1="160" y1="270" x2="640" y2="270" stroke="#ffffff" stroke-opacity="0.05" stroke-dasharray="3 3"/>
  <line x1="400" y1="90" x2="400" y2="450" stroke="#ffffff" stroke-opacity="0.05" stroke-dasharray="3 3"/>
  <line x1="220" y1="120" x2="580" y2="420" stroke="#c8ff42" stroke-opacity="0.08" stroke-dasharray="3 3"/>

  <!-- Center Emblem Card -->
  <g filter="url(#shadow1)">
    <rect x="250" y="110" width="300" height="320" rx="16" fill="#1b1c19" stroke="#33352f" stroke-width="1.5"/>
    
    <!-- Decorative Corner Marks -->
    <path d="M 270 130 L 285 130 M 270 130 L 270 145" stroke="#c8ff42" stroke-width="2" fill="none"/>
    <path d="M 530 130 L 515 130 M 530 130 L 530 145" stroke="#c8ff42" stroke-width="2" fill="none"/>
    <path d="M 270 410 L 285 410 M 270 410 L 270 395" stroke="#c8ff42" stroke-width="2" fill="none"/>
    <path d="M 530 410 L 515 410 M 530 410 L 530 395" stroke="#c8ff42" stroke-width="2" fill="none"/>

    <!-- Geometric Andrade 'A' & 'R' Monogram -->
    <g transform="translate(400, 240)">
      <!-- Outer Hexagon Frame -->
      <polygon points="0,-75 65,-37.5 65,37.5 0,75 -65,37.5 -65,-37.5" fill="none" stroke="url(#lime1)" stroke-width="3"/>
      
      <!-- Monogram Structure -->
      <path d="M -30 40 L -30 -35 L 0 -55 L 30 -35 L 30 40" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M -30 5 L 30 5" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
      <path d="M 0 -55 L 0 40" stroke="url(#lime1)" stroke-width="4" stroke-linecap="round"/>
      <circle cx="0" cy="-5" r="7" fill="#c8ff42"/>
    </g>

    <!-- Brand Typography inside Card -->
    <text x="400" y="360" font-family="'Manrope', 'DM Sans', sans-serif" font-weight="800" font-size="18" fill="#ffffff" text-anchor="middle" letter-spacing="4">ANDRADE</text>
    <text x="400" y="385" font-family="'DM Sans', sans-serif" font-weight="600" font-size="10" fill="#a09d94" text-anchor="middle" letter-spacing="3">MONOGRAM CREATION</text>
  </g>

  <!-- Tag & Metrics Floating Badges -->
  <g transform="translate(100, 480)">
    <rect width="180" height="46" rx="8" fill="#1f201c" stroke="#333" stroke-width="1"/>
    <text x="20" y="22" font-family="'Manrope', sans-serif" font-size="9" font-weight="700" fill="#c8ff42" letter-spacing="1.5">CATEGORY</text>
    <text x="20" y="36" font-family="'DM Sans', sans-serif" font-size="12" font-weight="600" fill="#eae8e0">Logo Creation</text>
  </g>

  <g transform="translate(520, 480)">
    <rect width="180" height="46" rx="8" fill="#1f201c" stroke="#333" stroke-width="1"/>
    <text x="20" y="22" font-family="'Manrope', sans-serif" font-size="9" font-weight="700" fill="#c8ff42" letter-spacing="1.5">SPECIFICATION</text>
    <text x="20" y="36" font-family="'DM Sans', sans-serif" font-size="12" font-weight="600" fill="#eae8e0">Geometric Vector Mark</text>
  </g>

  <!-- Top bar label -->
  <text x="40" y="50" font-family="'Manrope', sans-serif" font-size="12" font-weight="800" fill="#c8ff42" letter-spacing="2">01 / LOGO DESIGN</text>
  <text x="760" y="50" font-family="'DM Sans', sans-serif" font-size="11" font-weight="500" fill="#77746d" text-anchor="end">GOLDEN RATIO GRID</text>
</svg>