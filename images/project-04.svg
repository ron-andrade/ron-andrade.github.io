<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2220"/>
      <stop offset="100%" stop-color="#121413"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2ddd4"/>
      <stop offset="70%" stop-color="#f5f2eb"/>
      <stop offset="100%" stop-color="#dad5cb"/>
    </linearGradient>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#243026"/>
      <stop offset="30%" stop-color="#3d5242"/>
      <stop offset="70%" stop-color="#2b3b2e"/>
      <stop offset="100%" stop-color="#18211a"/>
    </linearGradient>
    <linearGradient id="dropperGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a3a38"/>
      <stop offset="50%" stop-color="#555552"/>
      <stop offset="100%" stop-color="#282826"/>
    </linearGradient>
    <filter id="packShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="25" stdDeviation="22" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg4)"/>
  
  <!-- Podium Stand -->
  <ellipse cx="400" cy="460" rx="260" ry="40" fill="#181a19" opacity="0.8"/>
  <ellipse cx="400" cy="455" rx="220" ry="32" fill="#292c29"/>

  <!-- Left: Packaging Box -->
  <g transform="translate(200, 140)" filter="url(#packShadow)">
    <!-- Box Body 180x300 -->
    <rect width="180" height="300" rx="4" fill="url(#boxGrad)" stroke="#c4bead" stroke-width="1"/>
    
    <!-- Box Design Layout -->
    <text x="90" y="55" font-family="'Manrope', sans-serif" font-weight="800" font-size="16" fill="#1e221f" text-anchor="middle" letter-spacing="3">BOTANICA</text>
    <text x="90" y="72" font-family="'DM Sans', sans-serif" font-weight="600" font-size="7.5" fill="#586359" text-anchor="middle" letter-spacing="2">LABORATOIRES</text>

    <!-- Minimalist line icon -->
    <circle cx="90" cy="115" r="22" fill="none" stroke="#586359" stroke-width="1"/>
    <path d="M 90 100 C 90 115 102 120 102 125 C 102 130 90 132 90 132 C 90 132 78 130 78 125 C 78 120 90 115 90 100 Z" fill="#586359"/>

    <line x1="30" y1="160" x2="150" y2="160" stroke="#d5d0c3" stroke-width="0.8"/>

    <!-- Product Title -->
    <text x="90" y="190" font-family="'Manrope', sans-serif" font-weight="700" font-size="12" fill="#1e221f" text-anchor="middle">REPAIR SERUM</text>
    <text x="90" y="208" font-family="'DM Sans', sans-serif" font-weight="500" font-size="8.5" fill="#586359" text-anchor="middle">Squalane + Peptides</text>

    <text x="90" y="240" font-family="'DM Sans', sans-serif" font-size="7" fill="#888" text-anchor="middle">Intense Hydration &amp; Barrier Defense</text>
    <text x="90" y="252" font-family="'DM Sans', sans-serif" font-size="7" fill="#888" text-anchor="middle">Dermatologically Tested · Vegan</text>

    <!-- Bottom volume -->
    <rect x="0" y="275" width="180" height="25" fill="#243026" rx="0 0 4 4"/>
    <text x="90" y="291" font-family="'Manrope', sans-serif" font-weight="700" font-size="8" fill="#c8ff42" text-anchor="middle" letter-spacing="2">50 ML · 1.7 FL. OZ.</text>
  </g>

  <!-- Right: Glass Dropper Bottle (Overlapping in front) -->
  <g transform="translate(420, 160)" filter="url(#packShadow)">
    <!-- Dropper Pipette Top & Rubber bulb -->
    <path d="M 45 0 Q 55 -15 65 0 L 65 18 L 45 18 Z" fill="#222"/>
    <rect x="40" y="18" width="30" height="18" rx="2" fill="url(#dropperGrad)" stroke="#666" stroke-width="0.5"/>
    <rect x="36" y="36" width="38" height="12" rx="2" fill="#c8ff42"/>

    <!-- Bottle Body (Amber/Dark Olive Forest Glass) -->
    <path d="M 15 70 Q 15 48 40 48 L 70 48 Q 95 48 95 70 L 95 260 Q 95 275 80 275 L 30 275 Q 15 275 15 260 Z" fill="url(#bottleGrad)" stroke="#4a5f4e" stroke-width="1"/>

    <!-- Glass Reflection Highlight -->
    <path d="M 22 75 L 22 255" stroke="#ffffff" stroke-opacity="0.25" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Paper Bottle Label -->
    <rect x="18" y="100" width="74" height="135" rx="3" fill="#f5f2eb" stroke="#dfdbd0" stroke-width="0.8"/>
    
    <text x="55" y="125" font-family="'Manrope', sans-serif" font-weight="800" font-size="9" fill="#1e221f" text-anchor="middle" letter-spacing="1.5">BOTANICA</text>
    <circle cx="55" cy="142" r="7" fill="none" stroke="#243026" stroke-width="0.8"/>
    <text x="55" y="165" font-family="'Manrope', sans-serif" font-weight="700" font-size="7.5" fill="#1e221f" text-anchor="middle">SERUM</text>
    <text x="55" y="176" font-family="'DM Sans', sans-serif" font-size="5.5" fill="#666" text-anchor="middle">Squalane + Peptides</text>
    <line x1="30" y1="186" x2="80" y2="186" stroke="#ccc" stroke-width="0.5"/>
    <text x="55" y="200" font-family="'Manrope', sans-serif" font-weight="700" font-size="5.5" fill="#243026" text-anchor="middle">50 ML</text>
  </g>

  <!-- Category & Badges -->
  <text x="40" y="50" font-family="'Manrope', sans-serif" font-size="12" font-weight="800" fill="#c8ff42" letter-spacing="2">04 / PACKAGE DESIGN</text>
  <text x="760" y="50" font-family="'DM Sans', sans-serif" font-size="11" font-weight="500" fill="#777" text-anchor="end">LUXURY SKINCARE LINE</text>
</svg>