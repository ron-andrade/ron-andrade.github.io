<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191a18"/>
      <stop offset="100%" stop-color="#0d0e0c"/>
    </linearGradient>
    <filter id="posterShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg7)"/>

  <!-- Poster Frame 360x500 -->
  <g transform="translate(220, 50)" filter="url(#posterShadow)">
    <rect width="360" height="500" rx="4" fill="#eeece2" stroke="#dad6ca" stroke-width="1.5"/>

    <!-- Top Badge / Agency -->
    <rect x="25" y="25" width="60" height="20" fill="#11110f"/>
    <text x="55" y="38" font-family="'Manrope', sans-serif" font-weight="800" font-size="8" fill="#c8ff42" text-anchor="middle">ANDRADE</text>
    <text x="335" y="38" font-family="'DM Sans', sans-serif" font-weight="700" font-size="8" fill="#11110f" text-anchor="end" letter-spacing="2">JOB POSTING / 2026</text>

    <!-- Bold Swiss Typography -->
    <g transform="translate(25, 75)">
      <text x="0" y="55" font-family="'Manrope', sans-serif" font-weight="800" font-size="64" fill="#11110f" letter-spacing="-3">WE'RE</text>
      <text x="0" y="115" font-family="'Manrope', sans-serif" font-weight="800" font-size="64" fill="#ff4d2e" letter-spacing="-3">HIRING</text>
      <text x="0" y="150" font-family="'DM Sans', sans-serif" font-weight="600" font-size="14" fill="#444">SENIOR BRAND DESIGNER</text>
    </g>

    <!-- Visual Graphic Accent: Geometric Abstract Blocks -->
    <g transform="translate(25, 245)">
      <rect width="145" height="75" fill="#11110f"/>
      <circle cx="72" cy="37" r="22" fill="#c8ff42"/>
      
      <rect x="155" y="0" width="155" height="75" fill="#ff4d2e"/>
      <path d="M 175 60 L 290 15" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
      <polygon points="280,12 295,15 290,30" fill="#ffffff"/>
    </g>

    <!-- Requirements & Roles list -->
    <g transform="translate(25, 340)">
      <text x="0" y="12" font-family="'Manrope', sans-serif" font-weight="800" font-size="9" fill="#11110f" letter-spacing="1.5">WHAT WE ARE LOOKING FOR:</text>
      
      <circle cx="4" cy="28" r="2" fill="#ff4d2e"/>
      <text x="14" y="31" font-family="'DM Sans', sans-serif" font-size="8" fill="#333">5+ Years in Brand Systems, Print &amp; Digital</text>

      <circle cx="4" cy="44" r="2" fill="#ff4d2e"/>
      <text x="14" y="47" font-family="'DM Sans', sans-serif" font-size="8" fill="#333">Mastery in Illustrator, Photoshop &amp; Figma</text>

      <circle cx="4" cy="60" r="2" fill="#ff4d2e"/>
      <text x="14" y="63" font-family="'DM Sans', sans-serif" font-size="8" fill="#333">Strong print production knowledge (bleed, pre-press)</text>
    </g>

    <!-- Call to action button at bottom -->
    <rect x="25" y="430" width="310" height="42" fill="#11110f" rx="4"/>
    <text x="180" y="456" font-family="'Manrope', sans-serif" font-weight="800" font-size="11" fill="#c8ff42" text-anchor="middle" letter-spacing="2">APPLY NOW: CAREERS@STUDIO.COM</text>
  </g>

  <!-- Title Header -->
  <text x="40" y="50" font-family="'Manrope', sans-serif" font-size="12" font-weight="800" fill="#c8ff42" letter-spacing="2">07 / HIRING'S POSTER</text>
  <text x="760" y="50" font-family="'DM Sans', sans-serif" font-size="11" font-weight="500" fill="#777" text-anchor="end">SWISS TYPOGRAPHIC POSTER</text>
</svg>