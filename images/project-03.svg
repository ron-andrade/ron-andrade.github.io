<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181816"/>
      <stop offset="100%" stop-color="#0e0e0c"/>
    </linearGradient>
    <filter id="menuShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg3)"/>

  <!-- Menu Board Container -->
  <g transform="translate(180, 50)" filter="url(#menuShadow)">
    <!-- Wooden / Leather clipboard backboard -->
    <rect x="-10" y="-10" width="460" height="520" rx="12" fill="#2b2823" stroke="#3d3932" stroke-width="1.5"/>
    <rect x="180" y="-18" width="80" height="20" rx="4" fill="#a48136"/>
    <circle cx="220" cy="-8" r="4" fill="#181816"/>

    <!-- Paper Menu Sheet -->
    <rect x="10" y="10" width="420" height="480" rx="4" fill="#f6f3eb"/>
    
    <!-- Menu Header -->
    <text x="220" y="48" font-family="'Manrope', serif" font-weight="800" font-size="11" fill="#a07c30" text-anchor="middle" letter-spacing="4">BAR &amp; BISTRO</text>
    <text x="220" y="78" font-family="'Manrope', sans-serif" font-weight="800" font-size="22" fill="#1a1917" text-anchor="middle" letter-spacing="-0.5">L'ATELIER CULINAIRE</text>
    <line x1="160" y1="92" x2="280" y2="92" stroke="#c4bead" stroke-width="1"/>
    <text x="220" y="108" font-family="'DM Sans', sans-serif" font-weight="500" font-size="8" fill="#77736b" text-anchor="middle" letter-spacing="2">SEASONAL MENU · SPRING 2026</text>

    <!-- Section: SIGNATURE COCKTAILS -->
    <text x="40" y="145" font-family="'Manrope', sans-serif" font-weight="800" font-size="10" fill="#a07c30" letter-spacing="2">SIGNATURE CRAFT COCKTAILS</text>
    <line x1="40" y1="152" x2="380" y2="152" stroke="#e0dcce" stroke-width="1"/>

    <!-- Item 1 -->
    <text x="40" y="174" font-family="'Manrope', sans-serif" font-weight="700" font-size="11" fill="#1a1917">Smoked Rosemary Old Fashioned</text>
    <text x="380" y="174" font-family="'Manrope', sans-serif" font-weight="700" font-size="11" fill="#1a1917" text-anchor="end">18</text>
    <text x="40" y="188" font-family="'DM Sans', sans-serif" font-size="8.5" fill="#77736b">Small batch bourbon, smoked infused bitters, charred herbal essence</text>

    <!-- Item 2 -->
    <text x="40" y="212" font-family="'Manrope', sans-serif" font-weight="700" font-size="11" fill="#1a1917">Yuzu Botanical Highball</text>
    <text x="380" y="212" font-family="'Manrope', sans-serif" font-weight="700" font-size="11" fill="#1a1917" text-anchor="end">16</text>
    <text x="40" y="226" font-family="'DM Sans', sans-serif" font-size="8.5" fill="#77736b">Artisanal Japanese gin, sparkling yuzu elixir, elderflower foam</text>

    <!-- Section: SMALL PLATES -->
    <text x="40" y="268" font-family="'Manrope', sans-serif" font-weight="800" font-size="10" fill="#a07c30" letter-spacing="2">MAINS &amp; ARTISAN PLATES</text>
    <line x1="40" y1="275" x2="380" y2="275" stroke="#e0dcce" stroke-width="1"/>

    <!-- Item 3 -->
    <text x="40" y="297" font-family="'Manrope', sans-serif" font-weight="700" font-size="11" fill="#1a1917">Pan-Seared Hokkaido Scallops</text>
    <text x="380" y="297" font-family="'Manrope', sans-serif" font-weight="700" font-size="11" fill="#1a1917" text-anchor="end">28</text>
    <text x="40" y="311" font-family="'DM Sans', sans-serif" font-size="8.5" fill="#77736b">Cauliflower purée, crispy pancetta lardons, truffle emulsion</text>

    <!-- Item 4 -->
    <text x="40" y="335" font-family="'Manrope', sans-serif" font-weight="700" font-size="11" fill="#1a1917">Dry-Aged Black Angus Ribeye</text>
    <text x="380" y="335" font-family="'Manrope', sans-serif" font-weight="700" font-size="11" fill="#1a1917" text-anchor="end">46</text>
    <text x="40" y="349" font-family="'DM Sans', sans-serif" font-size="8.5" fill="#77736b">Bone marrow butter, pomme purée, reduction bordelaise</text>

    <!-- Section: DESSERT -->
    <text x="40" y="390" font-family="'Manrope', sans-serif" font-weight="800" font-size="10" fill="#a07c30" letter-spacing="2">DESSERT &amp; COFFEE</text>
    <line x1="40" y1="397" x2="380" y2="397" stroke="#e0dcce" stroke-width="1"/>

    <text x="40" y="419" font-family="'Manrope', sans-serif" font-weight="700" font-size="11" fill="#1a1917">Valrhona Dark Chocolate Soufflé</text>
    <text x="380" y="419" font-family="'Manrope', sans-serif" font-weight="700" font-size="11" fill="#1a1917" text-anchor="end">14</text>
    <text x="40" y="433" font-family="'DM Sans', sans-serif" font-size="8.5" fill="#77736b">Tahitian vanilla bean gelato, salted caramel drizzle</text>

    <!-- Footer of menu -->
    <text x="220" y="470" font-family="'DM Sans', sans-serif" font-weight="600" font-size="7.5" fill="#999" text-anchor="middle" letter-spacing="1.5">PLEASE INFORM YOUR SERVER OF ANY DIETARY ALLERGIES</text>
  </g>

  <!-- Side info badges -->
  <text x="40" y="50" font-family="'Manrope', sans-serif" font-size="12" font-weight="800" fill="#c8ff42" letter-spacing="2">03 / MENU'S DESIGN</text>
  <text x="760" y="50" font-family="'DM Sans', sans-serif" font-size="11" font-weight="500" fill="#777" text-anchor="end">HOSPITALITY EDITORIAL</text>
</svg>