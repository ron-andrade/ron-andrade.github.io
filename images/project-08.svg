<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1a1d"/>
      <stop offset="100%" stop-color="#141012"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0c5"/>
      <stop offset="50%" stop-color="#d99b8b"/>
      <stop offset="100%" stop-color="#b36d5c"/>
    </linearGradient>
    <linearGradient id="skinGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf0ea"/>
      <stop offset="100%" stop-color="#eed5cb"/>
    </linearGradient>
    <filter id="beautyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg8)"/>

  <!-- Social Post Frame 420x450 -->
  <g transform="translate(190, 70)" filter="url(#beautyShadow)">
    <rect width="420" height="460" rx="16" fill="#241e21" stroke="#3d3338" stroke-width="1.5"/>

    <!-- Header -->
    <circle cx="45" cy="45" r="18" fill="url(#roseGrad)"/>
    <text x="45" y="49" font-family="'Manrope', sans-serif" font-weight="800" font-size="11" fill="#fff" text-anchor="middle">VG</text>
    <text x="75" y="42" font-family="'Manrope', sans-serif" font-weight="700" font-size="12" fill="#ffffff">VELVET GLOW AESTHETICS</text>
    <text x="75" y="55" font-family="'DM Sans', sans-serif" font-size="9" fill="#c4a5b0">Beauty &amp; Dermatological Clinic</text>
    
    <circle cx="380" cy="45" r="3" fill="#c4a5b0"/>
    <circle cx="390" cy="45" r="3" fill="#c4a5b0"/>
    <circle cx="370" cy="45" r="3" fill="#c4a5b0"/>

    <line x1="25" y1="75" x2="395" y2="75" stroke="#382e34" stroke-width="1"/>

    <!-- Main Card Body Visual -->
    <g transform="translate(25, 90)">
      <rect width="370" height="280" rx="10" fill="url(#skinGlow)"/>

      <!-- Organic Graphic Waves / Beauty Floral Abstract -->
      <path d="M 0 160 Q 90 100 180 180 T 370 120 L 370 280 L 0 280 Z" fill="#ebd1c5" opacity="0.8"/>
      <path d="M 0 200 Q 120 140 240 220 T 370 180 L 370 280 L 0 280 Z" fill="#dfbeaf" opacity="0.9"/>

      <!-- Serum Bottle Silhouette & Radiance -->
      <g transform="translate(270, 70)">
        <ellipse cx="40" cy="90" rx="45" ry="45" fill="#ffffff" opacity="0.6" filter="blur(6px)"/>
        <!-- Bottle Body -->
        <rect x="25" y="35" width="30" height="75" rx="15" fill="#c47864"/>
        <rect x="33" y="20" width="14" height="15" fill="#2d2226"/>
        <circle cx="40" cy="15" r="6" fill="#dfbeaf"/>
        <text x="40" y="75" font-family="'Manrope', sans-serif" font-size="6" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">GLOW</text>
      </g>

      <!-- Editorial Typography on Card -->
      <g transform="translate(25, 35)">
        <rect width="90" height="18" rx="9" fill="#b36d5c"/>
        <text x="45" y="12" font-family="'Manrope', sans-serif" font-weight="700" font-size="7.5" fill="#ffffff" text-anchor="middle" letter-spacing="1">NEW TREATMENT</text>

        <text x="0" y="55" font-family="'Manrope', sans-serif" font-weight="800" font-size="22" fill="#241e21" letter-spacing="-0.5">Hydra Radiance</text>
        <text x="0" y="78" font-family="'Manrope', sans-serif" font-weight="800" font-size="22" fill="#b36d5c" letter-spacing="-0.5">Infusion Therapy.</text>

        <text x="0" y="110" font-family="'DM Sans', sans-serif" font-weight="500" font-size="9" fill="#544349">Instant luminosity, deep cell restoration</text>
        <text x="0" y="124" font-family="'DM Sans', sans-serif" font-weight="500" font-size="9" fill="#544349">&amp; collagen stimulation.</text>

        <g transform="translate(0, 150)">
          <rect width="130" height="32" rx="16" fill="#241e21"/>
          <text x="65" y="20" font-family="'Manrope', sans-serif" font-weight="700" font-size="8.5" fill="#fdf0ea" text-anchor="middle" letter-spacing="1">BOOK SESSION ↗</text>
        </g>
      </g>
    </g>

    <!-- Post Action Footer -->
    <g transform="translate(25, 390)">
      <path d="M 15 15 C 10 5, 0 10, 0 18 C 0 25, 15 32, 15 32 C 15 32, 30 25, 30 18 C 30 10, 20 5, 15 15 Z" fill="#d99b8b" transform="scale(0.6) translate(10, 0)"/>
      <circle cx="50" cy="12" r="8" fill="none" stroke="#c4a5b0" stroke-width="1.5"/>
      <path d="M 80 5 L 95 12 L 80 19 Z" fill="none" stroke="#c4a5b0" stroke-width="1.5"/>

      <text x="365" y="16" font-family="'DM Sans', sans-serif" font-weight="600" font-size="10" fill="#c4a5b0" text-anchor="end">2,480 Likes</text>
    </g>
  </g>

  <!-- Title Header -->
  <text x="40" y="50" font-family="'Manrope', sans-serif" font-size="12" font-weight="800" fill="#c8ff42" letter-spacing="2">08 / BEAUTY SOCIAL CONTENT'S</text>
  <text x="760" y="50" font-family="'DM Sans', sans-serif" font-size="11" font-weight="500" fill="#c4a5b0" text-anchor="end">EDITORIAL INSTAGRAM AD</text>
</svg>