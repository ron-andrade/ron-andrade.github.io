<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#232420"/>
      <stop offset="100%" stop-color="#141512"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0bd"/>
      <stop offset="30%" stop-color="#d6ae45"/>
      <stop offset="70%" stop-color="#eec96d"/>
      <stop offset="100%" stop-color="#a47e1b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b1c1a"/>
      <stop offset="100%" stop-color="#0f100e"/>
    </linearGradient>
    <filter id="cardShadow1" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="-10" dy="25" stdDeviation="20" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="cardShadow2" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="15" dy="30" stdDeviation="25" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Background surface -->
  <rect width="800" height="600" fill="url(#bg2)"/>

  <!-- Perspective Floor line / gradient -->
  <path d="M 0 420 L 800 380 L 800 600 L 0 600 Z" fill="#111210" opacity="0.6"/>

  <!-- Back Card (Angled, Front View) -->
  <g transform="translate(180, 100) rotate(-12)" filter="url(#cardShadow1)">
    <!-- Card Body 350x200 (standard US ratio) -->
    <rect width="360" height="210" rx="10" fill="url(#cardGrad)" stroke="#3a3c36" stroke-width="1.5"/>
    <!-- Textured pattern on card -->
    <circle cx="180" cy="105" r="70" fill="none" stroke="#2c2d29" stroke-width="35" opacity="0.4"/>
    <!-- Gold Foil Monogram Emblem -->
    <g transform="translate(180, 95)">
      <circle cx="0" cy="0" r="38" fill="none" stroke="url(#gold2)" stroke-width="2"/>
      <polygon points="0,-24 21,-12 21,12 0,24 -21,12 -21,-12" fill="none" stroke="url(#gold2)" stroke-width="1.5"/>
      <text x="0" y="8" font-family="'Manrope', sans-serif" font-weight="800" font-size="20" fill="url(#gold2)" text-anchor="middle">RA</text>
    </g>
    <text x="180" y="170" font-family="'Manrope', sans-serif" font-weight="700" font-size="9" fill="url(#gold2)" text-anchor="middle" letter-spacing="4">STUDIO ANDRADE</text>
  </g>

  <!-- Front Card (Overlapping, Details View) -->
  <g transform="translate(290, 230) rotate(8)" filter="url(#cardShadow2)">
    <rect width="370" height="215" rx="10" fill="#f5f3ec" stroke="#e0ded6" stroke-width="1"/>
    
    <!-- Edge Accent Line -->
    <rect x="0" y="0" width="8" height="215" rx="4" fill="#11110f"/>
    <rect x="362" y="0" width="8" height="215" rx="4" fill="url(#gold2)"/>

    <!-- Contact Info / Content -->
    <text x="35" y="48" font-family="'Manrope', sans-serif" font-weight="800" font-size="16" fill="#11110f" letter-spacing="-0.5">RONALD ANDRADE</text>
    <text x="35" y="66" font-family="'DM Sans', sans-serif" font-weight="600" font-size="9" fill="#77746d" letter-spacing="2">GRAPHIC DESIGNER &amp; ART DIRECTOR</text>
    
    <line x1="35" y1="85" x2="335" y2="85" stroke="#d5d1c7" stroke-width="1"/>

    <!-- Detail rows -->
    <text x="35" y="115" font-family="'DM Sans', sans-serif" font-size="9" font-weight="600" fill="#11110f">T /</text>
    <text x="55" y="115" font-family="'DM Sans', sans-serif" font-size="9" font-weight="400" fill="#55534e">+971 50 153 3173</text>

    <text x="35" y="138" font-family="'DM Sans', sans-serif" font-size="9" font-weight="600" fill="#11110f">E /</text>
    <text x="55" y="138" font-family="'DM Sans', sans-serif" font-size="9" font-weight="400" fill="#55534e">andrade.ron011@gmail.com</text>

    <text x="35" y="161" font-family="'DM Sans', sans-serif" font-size="9" font-weight="600" fill="#11110f">W /</text>
    <text x="55" y="161" font-family="'DM Sans', sans-serif" font-size="9" font-weight="400" fill="#55534e">sites.google.com/view/andrade-ron</text>

    <text x="35" y="184" font-family="'DM Sans', sans-serif" font-size="9" font-weight="600" fill="#11110f">L /</text>
    <text x="55" y="184" font-family="'DM Sans', sans-serif" font-size="9" font-weight="400" fill="#55534e">Abu Dhabi, United Arab Emirates</text>

    <!-- Mini embossed logo mark on corner -->
    <g transform="translate(315, 170)">
      <polygon points="0,-14 12,-7 12,7 0,14 -12,7 -12,-7" fill="none" stroke="#11110f" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="3" fill="#11110f"/>
    </g>
  </g>

  <!-- Title / Category Header -->
  <text x="40" y="50" font-family="'Manrope', sans-serif" font-size="12" font-weight="800" fill="#c8ff42" letter-spacing="2">02 / BUSINESS CARDS &amp; CARDS</text>
  <text x="760" y="50" font-family="'DM Sans', sans-serif" font-size="11" font-weight="500" fill="#999" text-anchor="end">600GSM COTTON + GOLD FOIL</text>
</svg>