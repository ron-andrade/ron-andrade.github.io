<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191917"/>
      <stop offset="100%" stop-color="#0c0d0b"/>
    </linearGradient>
    <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#242522"/>
      <stop offset="35%" stop-color="#383a34"/>
      <stop offset="70%" stop-color="#2c2e28"/>
      <stop offset="100%" stop-color="#181916"/>
    </linearGradient>
    <filter id="pouchShadow" x="-25%" y="-15%" width="150%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="24" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg9)"/>

  <!-- Podium base -->
  <ellipse cx="400" cy="480" rx="260" ry="35" fill="#141513"/>
  <ellipse cx="400" cy="475" rx="220" ry="26" fill="#20221e"/>

  <!-- Coffee Pouch (300x420) -->
  <g transform="translate(250, 70)" filter="url(#pouchShadow)">
    <!-- Standup Pouch shape with gusset top -->
    <!-- Top zip seal heat press -->
    <polygon points="30,20 270,20 280,45 20,45" fill="#20211e" stroke="#444" stroke-width="0.5"/>
    <line x1="25" y1="32" x2="275" y2="32" stroke="#111" stroke-width="1.5" stroke-dasharray="2 3"/>

    <!-- Main Pouch Body -->
    <path d="M 20 45 L 280 45 L 265 400 Q 260 410 240 410 L 60 410 Q 40 410 35 400 Z" fill="url(#pouchGrad)" stroke="#454740" stroke-width="1"/>
    
    <!-- Bag wrinkle shadow highlights -->
    <path d="M 40 55 Q 80 180 50 390" stroke="#ffffff" stroke-opacity="0.06" stroke-width="6" fill="none"/>
    <path d="M 260 55 Q 220 180 250 390" stroke="#000000" stroke-opacity="0.3" stroke-width="8" fill="none"/>

    <!-- Matte Paper Product Label (Front Center 200x260) -->
    <g transform="translate(50, 85)">
      <rect width="200" height="260" rx="6" fill="#f4f1e8" stroke="#dcd8cb" stroke-width="1"/>

      <!-- Label Top Brand Header -->
      <text x="100" y="32" font-family="'Manrope', sans-serif" font-weight="800" font-size="14" fill="#181916" text-anchor="middle" letter-spacing="3">ORIGIN ROAST</text>
      <text x="100" y="46" font-family="'DM Sans', sans-serif" font-weight="600" font-size="7" fill="#8c7853" text-anchor="middle" letter-spacing="2">SINGLE ORIGIN SPECIALTY COFFEE</text>
      <line x1="20" y1="58" x2="180" y2="58" stroke="#d5d0c0" stroke-width="0.8"/>

      <!-- Big Origin Typography -->
      <g transform="translate(100, 95)">
        <text x="0" y="0" font-family="'Manrope', sans-serif" font-weight="800" font-size="22" fill="#181916" text-anchor="middle" letter-spacing="-0.5">ETHIOPIA</text>
        <text x="0" y="16" font-family="'Manrope', sans-serif" font-weight="700" font-size="11" fill="#c46231" text-anchor="middle">YIRGACHEFFE G1</text>
      </g>

      <!-- Flavor Notes Badges -->
      <g transform="translate(15, 130)">
        <rect x="0" y="0" width="52" height="18" rx="9" fill="#181916"/>
        <text x="26" y="12" font-family="'DM Sans', sans-serif" font-size="7" font-weight="700" fill="#c8ff42" text-anchor="middle">JASMINE</text>

        <rect x="58" y="0" width="54" height="18" rx="9" fill="#181916"/>
        <text x="85" y="12" font-family="'DM Sans', sans-serif" font-size="7" font-weight="700" fill="#c8ff42" text-anchor="middle">BERGAMOT</text>

        <rect x="118" y="0" width="52" height="18" rx="9" fill="#181916"/>
        <text x="144" y="12" font-family="'DM Sans', sans-serif" font-size="7" font-weight="700" fill="#c8ff42" text-anchor="middle">PEACH</text>
      </g>

      <!-- Specs Table -->
      <g transform="translate(20, 175)">
        <text x="0" y="0" font-family="'DM Sans', sans-serif" font-size="7.5" font-weight="700" fill="#181916">ALTITUDE:</text>
        <text x="160" y="0" font-family="'DM Sans', sans-serif" font-size="7.5" fill="#666" text-anchor="end">1,950 - 2,200 MASL</text>

        <text x="0" y="16" font-family="'DM Sans', sans-serif" font-size="7.5" font-weight="700" fill="#181916">PROCESS:</text>
        <text x="160" y="16" font-family="'DM Sans', sans-serif" font-size="7.5" fill="#666" text-anchor="end">Washed Heirloom</text>

        <text x="0" y="32" font-family="'DM Sans', sans-serif" font-size="7.5" font-weight="700" fill="#181916">ROAST LEVEL:</text>
        <text x="160" y="32" font-family="'DM Sans', sans-serif" font-size="7.5" fill="#666" text-anchor="end">Light-Medium Filter</text>
      </g>

      <!-- Label Footer / Net Weight -->
      <line x1="20" y1="228" x2="180" y2="228" stroke="#d5d0c0" stroke-width="0.8"/>
      <text x="100" y="246" font-family="'Manrope', sans-serif" font-weight="800" font-size="8" fill="#181916" text-anchor="middle" letter-spacing="2">NET WT. 250G / 8.8 OZ</text>
    </g>

    <!-- Valve Circle -->
    <circle cx="150" cy="370" r="10" fill="#181916" stroke="#444" stroke-width="1"/>
    <circle cx="150" cy="370" r="3" fill="#111"/>
  </g>

  <!-- Title Header -->
  <text x="40" y="50" font-family="'Manrope', sans-serif" font-size="12" font-weight="800" fill="#c8ff42" letter-spacing="2">09 / PACKAGE &amp; LABELS</text>
  <text x="760" y="50" font-family="'DM Sans', sans-serif" font-size="11" font-weight="500" fill="#777" text-anchor="end">SPECIALTY PACKAGING</text>
</svg>