<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1118"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0077ff"/>
    </linearGradient>
    <filter id="glow10" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="postShadow10" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg10)"/>

  <!-- Social Media Post Card (420x460) -->
  <g transform="translate(190, 70)" filter="url(#postShadow10)">
    <rect width="420" height="460" rx="16" fill="#121620" stroke="#1e2536" stroke-width="1.5"/>

    <!-- Social header -->
    <circle cx="45" cy="45" r="18" fill="url(#neonCyan)"/>
    <text x="45" y="50" font-family="'Manrope', sans-serif" font-weight="800" font-size="11" fill="#05070a" text-anchor="middle">HP</text>
    <text x="75" y="42" font-family="'Manrope', sans-serif" font-weight="700" font-size="12" fill="#ffffff">HYPERPULSE AUDIO</text>
    <text x="75" y="55" font-family="'DM Sans', sans-serif" font-size="9" fill="#64748b">Flagship Tech &amp; Hardware</text>
    <rect x="345" y="36" width="50" height="18" rx="4" fill="#00f0ff" fill-opacity="0.15"/>
    <text x="370" y="48" font-family="'Manrope', sans-serif" font-size="8" font-weight="800" fill="#00f0ff" text-anchor="middle">PROMO</text>

    <line x1="25" y1="75" x2="395" y2="75" stroke="#1e2536" stroke-width="1"/>

    <!-- Inner Visual Canvas -->
    <g transform="translate(25, 90)">
      <rect width="370" height="280" rx="10" fill="#090b10"/>
      
      <!-- Cyan and Lime Lighting Halos in background -->
      <circle cx="185" cy="140" r="110" fill="#00f0ff" fill-opacity="0.08" filter="blur(20px)"/>
      <circle cx="280" cy="80" r="60" fill="#c8ff42" fill-opacity="0.08" filter="blur(15px)"/>

      <!-- Audio Waveform Graphic Lines -->
      <g opacity="0.3" stroke="#00f0ff" stroke-width="2" stroke-linecap="round">
        <line x1="40" y1="130" x2="40" y2="150"/>
        <line x1="50" y1="115" x2="50" y2="165"/>
        <line x1="60" y1="100" x2="60" y2="180"/>
        <line x1="70" y1="120" x2="70" y2="160"/>
        <line x1="80" y1="135" x2="80" y2="145"/>
      </g>

      <!-- Tech Headphone Vector Illustration -->
      <g transform="translate(185, 135)">
        <!-- Headband Arc -->
        <path d="M -70 20 C -70 -75, 70 -75, 70 20" fill="none" stroke="#2a3040" stroke-width="14" stroke-linecap="round"/>
        <path d="M -70 20 C -70 -75, 70 -75, 70 20" fill="none" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" filter="url(#glow10)"/>

        <!-- Left Ear Cup -->
        <g transform="translate(-70, 20)">
          <ellipse cx="0" cy="0" rx="20" ry="32" fill="#181d28" stroke="#00f0ff" stroke-width="1.5"/>
          <ellipse cx="0" cy="0" rx="12" ry="22" fill="#0f131a"/>
          <circle cx="0" cy="0" r="4" fill="#c8ff42"/>
        </g>

        <!-- Right Ear Cup -->
        <g transform="translate(70, 20)">
          <ellipse cx="0" cy="0" rx="20" ry="32" fill="#181d28" stroke="#00f0ff" stroke-width="1.5"/>
          <ellipse cx="0" cy="0" rx="12" ry="22" fill="#0f131a"/>
          <circle cx="0" cy="0" r="4" fill="#c8ff42"/>
        </g>
      </g>

      <!-- Headline & Offer Overlay -->
      <g transform="translate(25, 25)">
        <text x="0" y="20" font-family="'Manrope', sans-serif" font-weight="800" font-size="20" fill="#ffffff">SONIC-X PRO</text>
        <text x="0" y="38" font-family="'DM Sans', sans-serif" font-weight="700" font-size="10" fill="#00f0ff" letter-spacing="1">HYBRID ACTIVE NOISE CANCELLATION</text>
      </g>

      <!-- Feature Badges -->
      <g transform="translate(25, 210)">
        <rect width="100" height="24" rx="4" fill="#161b26" stroke="#252d3d" stroke-width="1"/>
        <text x="50" y="15" font-family="'Manrope', sans-serif" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle">60H BATTERY</text>

        <rect x="110" y="0" width="110" height="24" rx="4" fill="#161b26" stroke="#252d3d" stroke-width="1"/>
        <text x="165" y="15" font-family="'Manrope', sans-serif" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle">HI-RES LOSSLESS</text>

        <rect x="230" y="0" width="80" height="24" rx="4" fill="#00f0ff"/>
        <text x="270" y="15" font-family="'Manrope', sans-serif" font-size="8.5" font-weight="800" fill="#090b10" text-anchor="middle">SHOP NOW</text>
      </g>
    </g>

    <!-- Footer Stats -->
    <g transform="translate(25, 390)">
      <text x="0" y="16" font-family="'Manrope', sans-serif" font-weight="800" font-size="15" fill="#ffffff">$299 <tspan font-size="11" font-weight="500" fill="#64748b" text-decoration="line-through">$399</tspan></text>
      <text x="365" y="16" font-family="'DM Sans', sans-serif" font-weight="600" font-size="10" fill="#00f0ff" text-anchor="end">Limited Launch Deal ↗</text>
    </g>
  </g>

  <!-- Title Header -->
  <text x="40" y="50" font-family="'Manrope', sans-serif" font-size="12" font-weight="800" fill="#c8ff42" letter-spacing="2">10 / PRODUCT SOCIAL CONTENT'S</text>
  <text x="760" y="50" font-family="'DM Sans', sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="end">HARDWARE LAUNCH AD</text>
</svg>