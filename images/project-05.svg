<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171e"/>
      <stop offset="100%" stop-color="#0c0e12"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="postShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg5)"/>

  <!-- Social Post Canvas 1080x1080 simulated in 420x420 -->
  <g transform="translate(190, 70)" filter="url(#postShadow)">
    <rect width="420" height="460" rx="16" fill="#1e222b" stroke="#2e3543" stroke-width="1.5"/>

    <!-- Social Post Header -->
    <circle cx="45" cy="45" r="18" fill="url(#blueGrad)"/>
    <text x="45" y="50" font-family="'Manrope', sans-serif" font-weight="800" font-size="12" fill="#fff" text-anchor="middle">A</text>
    <text x="75" y="42" font-family="'Manrope', sans-serif" font-weight="700" font-size="12" fill="#ffffff">APEX ADVISORY</text>
    <text x="75" y="55" font-family="'DM Sans', sans-serif" font-size="9" fill="#8c9ab0">Strategic Growth &amp; Consulting</text>
    
    <circle cx="380" cy="45" r="3" fill="#8c9ab0"/>
    <circle cx="390" cy="45" r="3" fill="#8c9ab0"/>
    <circle cx="370" cy="45" r="3" fill="#8c9ab0"/>

    <line x1="25" y1="75" x2="395" y2="75" stroke="#2a303d" stroke-width="1"/>

    <!-- Post Main Content Area -->
    <rect x="25" y="90" width="370" height="270" rx="10" fill="#13161c"/>
    
    <!-- Tagline & Badge -->
    <rect x="45" y="110" width="100" height="22" rx="11" fill="#2563eb" fill-opacity="0.2"/>
    <text x="95" y="125" font-family="'Manrope', sans-serif" font-weight="700" font-size="8.5" fill="#60a5fa" text-anchor="middle" letter-spacing="1">SERVICE INSIGHTS</text>

    <!-- Main Big Headline -->
    <text x="45" y="165" font-family="'Manrope', sans-serif" font-weight="800" font-size="20" fill="#ffffff" letter-spacing="-0.5">Scale Your Revenue</text>
    <text x="45" y="190" font-family="'Manrope', sans-serif" font-weight="800" font-size="20" fill="#60a5fa" letter-spacing="-0.5">With Data-Driven</text>
    <text x="45" y="215" font-family="'Manrope', sans-serif" font-weight="800" font-size="20" fill="#ffffff" letter-spacing="-0.5">Advisory Services.</text>

    <!-- Metric Card Box -->
    <g transform="translate(45, 240)">
      <rect width="155" height="90" rx="8" fill="#1c202a" stroke="#2e3543" stroke-width="1"/>
      <text x="18" y="32" font-family="'Manrope', sans-serif" font-weight="800" font-size="24" fill="#c8ff42">+148%</text>
      <text x="18" y="55" font-family="'DM Sans', sans-serif" font-size="9" font-weight="600" fill="#ffffff">Client Growth</text>
      <text x="18" y="70" font-family="'DM Sans', sans-serif" font-size="7.5" fill="#8c9ab0">Average YoY ROI metric</text>
    </g>

    <g transform="translate(220, 240)">
      <rect width="155" height="90" rx="8" fill="#1c202a" stroke="#2e3543" stroke-width="1"/>
      <text x="18" y="32" font-family="'Manrope', sans-serif" font-weight="800" font-size="24" fill="#60a5fa">45+ Days</text>
      <text x="18" y="55" font-family="'DM Sans', sans-serif" font-size="9" font-weight="600" fill="#ffffff">Time to Market</text>
      <text x="18" y="70" font-family="'DM Sans', sans-serif" font-size="7.5" fill="#8c9ab0">Faster strategic rollout</text>
    </g>

    <!-- Post Engagement Footer / Swipe prompt -->
    <g transform="translate(25, 385)">
      <!-- Swipe indicator -->
      <rect width="120" height="32" rx="16" fill="#2563eb"/>
      <text x="50" y="20" font-family="'Manrope', sans-serif" font-weight="700" font-size="9.5" fill="#ffffff">SWIPE NEXT</text>
      <path d="M 95 16 L 102 16 M 99 12 L 103 16 L 99 20" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round"/>

      <!-- Dots carousel indicator -->
      <circle cx="210" cy="16" r="4" fill="#60a5fa"/>
      <circle cx="225" cy="16" r="3" fill="#475569"/>
      <circle cx="238" cy="16" r="3" fill="#475569"/>
      <circle cx="251" cy="16" r="3" fill="#475569"/>

      <text x="365" y="20" font-family="'DM Sans', sans-serif" font-weight="600" font-size="10" fill="#94a3b8" text-anchor="end">1 / 4</text>
    </g>
  </g>

  <!-- Top bar header -->
  <text x="40" y="50" font-family="'Manrope', sans-serif" font-size="12" font-weight="800" fill="#c8ff42" letter-spacing="2">05 / SERVICE SOCIAL CONTENT</text>
  <text x="760" y="50" font-family="'DM Sans', sans-serif" font-size="11" font-weight="500" fill="#8c9ab0" text-anchor="end">CAROUSEL CAMPAIGN</text>
</svg>